name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore API
        run: dotnet restore src/DigiPrice.Api/DigiPrice.Api.csproj
      - name: Build API
        run: dotnet build src/DigiPrice.Api/DigiPrice.Api.csproj --configuration Release --no-restore
      - name: Test core
        run: dotnet test tests/DigiPrice.Core.Tests/DigiPrice.Core.Tests.csproj --configuration Release
